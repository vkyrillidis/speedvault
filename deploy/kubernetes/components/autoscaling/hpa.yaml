apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: speedvault
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: speedvault
  # The base's three; scaling by hand below it would be undone.
  minReplicas: 3
  maxReplicas: 12
  # 70% leaves room for the moves: a new node relieves the others only
  # once its slots have arrived.
  metrics:
    - type: Pods
      pods:
        metric:
          name: speedvault_busy_cores
        target:
          type: AverageValue
          averageValue: 700m
    - type: Pods
      pods:
        metric:
          name: speedvault_memory_used_ratio
        target:
          type: AverageValue
          averageValue: 700m
  behavior:
    # After a minute of load, at most two pods per five minutes.
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 300
    # Never down by itself: scaling down moves every key of the nodes
    # removed, and load that comes and goes would move them back and forth.
    scaleDown:
      selectPolicy: Disabled
