# The nodes: a StatefulSet of one-core pods. Each announces its pod's
# address (10.244.0.7:7000), which is where stuart and clients reach it,
# and joins stuart with its pod's name (speedvault-3). A pod that restarts
# comes back under its name, at a new address, with a new id and no keys:
# stuart takes it for the node it replaces and gives it slots again.
#
# Addresses, not names, for the clients: a client keeps a connection per
# node address and reconnects it when it drops. Announced as a name, a
# restarted pod's would be the old one's, and a client caching DNS (Java
# clients such as Lettuce do, for the record's TTL: 30 s from CoreDNS by
# default) would reconnect to the old pod's address, where nothing answers,
# and its commands time out. Redis Cluster on Kubernetes announces pod
# addresses too.
#
# stuart makes half the pods replicas (`stuart --replicas 1`): six pods
# are three primaries, each with a replica on another machine where it can
# (a node's zone is its Kubernetes node: --zone). A replica serves nothing
# but holds a copy of its primary's keys; a primary lost (its pod killed,
# its machine gone) is replaced by its replica within seconds, losing at
# most the writes it hadn't passed on. Add and remove pods in pairs.
#
# On SIGTERM (a scale-down, a rolling update, an eviction, `kubectl delete
# pod`) a primary hands its slots to its replica, its writes waiting a few
# milliseconds, and exits; no key moves. A replica just exits. A primary
# without a replica to take over (none, or one still syncing after a
# minute) drains instead: its slots move to the others while it serves on.
# The grace period is longer than such a drain may take (--drain-timeout,
# 600 s by default), and pods stop one at a time, each next one only once
# the last is back and synced (ready).

# Headless: the StatefulSet's Service, a DNS name per pod (for people:
# clients and stuart use the pods' addresses), published before the pod is
# ready and while it drains.
apiVersion: v1
kind: Service
metadata:
  name: speedvault
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: speedvault
  ports:
    - name: redis
      port: 7000
    - name: metrics
      port: 9121
---
# The clients' seed: any node that is ready (joined, not leaving). Cluster
# clients only read the slot map from it, then go to the nodes by name.
apiVersion: v1
kind: Service
metadata:
  name: speedvault-seed
spec:
  selector:
    app.kubernetes.io/name: speedvault
  ports:
    - name: redis
      port: 7000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: speedvault
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: speedvault
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: speedvault
spec:
  serviceName: speedvault
  # Three primaries and their replicas.
  replicas: 6
  # One pod at a time, so a scale-down drains one node after another.
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: speedvault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speedvault
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      # Longer than --drain-timeout and --leave-linger: the node exits by
      # itself (status 1 if it ran out of time) before Kubernetes kills it.
      # A handover takes milliseconds; this is for a primary that drains.
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # The pods spread over the machines, as evenly as they can, so that
      # stuart can pair each primary with a replica on another (stuart
      # pairs them as they join, by --zone). Not required: on fewer
      # machines than pods they share, and a replica may share its
      # primary's machine.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: speedvault
      containers:
        - name: node
          image: speedvault
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The machine: stuart puts a replica on another than its
            # primary's.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          args:
            - "7000"
            - --cluster
            - --announce
            - $(POD_IP):7000
            - --stuart
            - stuart.$(POD_NAMESPACE).svc:7600
            - --name
            - $(POD_NAME)
            - --zone
            - $(NODE_NAME)
            - --drain-timeout
            - "600"
            # Of the container's memory limit; the rest is the allocator's
            # and the connections'. Past it, writes get -OOM, and at 90% of
            # it stuart moves no more slots here.
            - --maxmemory
            - 75%
            - --metrics
            - "9121"
          ports:
            - name: redis
              containerPort: 7000
            - name: metrics
              containerPort: 9121
          # Ready once stuart took its join (and, a replica, once synced
          # with its primary), until it starts leaving.
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          # One core, all of it (the node is one thread); requests = limits.
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
