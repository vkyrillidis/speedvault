# A speedvault cluster on Kubernetes: stuart and six nodes, three
# primaries with a replica each.
#
#   kubectl apply -k deploy/kubernetes/base            # in the current namespace
#   kubectl scale statefulset speedvault --replicas 8  # a new pair: stuart gives it slots
#   kubectl scale statefulset speedvault --replicas 6  # the last two go (their slots move first)
#
# Clients in the Kubernetes cluster use speedvault-seed:7000 as their seed
# (any namespace: speedvault-seed.<namespace>.svc:7000) and are redirected
# to the nodes' pod addresses. See the README's "Run on Kubernetes".
#
# Pick the image with Kustomize (an overlay, or `kustomize edit set image
# speedvault=registry.example/speedvault:TAG`); the nodes' size is in
# nodes.yaml (one CPU, 1 GiB, 75% of it for keys). Without replicas (half
# the pods, no copy of any key): components/no-replicas.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: speedvault

resources:
  - stuart.yaml
  - nodes.yaml

images:
  - name: speedvault
    newName: speedvault
    newTag: latest
